name: Apply PAPER.md statistic corrections

on:
  push:
    branches:
      - fix-paper-md-stat-rounding

permissions:
  contents: write

jobs:
  patch-paper:
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: fix-paper-md-stat-rounding

      - name: Apply verified statistic corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          paper = Path("PAPER.md")
          text = paper.read_text(encoding="utf-8")

          replacements = {
              "| Qwen3-235B | 97.33% | 97.33% | 97.33% | 0.67 pp | 0.94 pp |":
                  "| Qwen3-235B | 97.34% | 97.34% | 97.34% | 0.67 pp | 0.94 pp |",
              "| Qwen3-30B | 91.00% | 91.00% | 91.00% | 2.33 pp | 3.09 pp |":
                  "| Qwen3-30B | 91.02% | 91.02% | 91.02% | 2.33 pp | 3.09 pp |",
              "| GPT-5 | 90.67% | 92.33% | 91.50% | 1.67 pp | 2.00 pp |":
                  "| GPT-5 | 90.66% | 92.35% | 91.50% | 1.67 pp | 2.00 pp |",
              "| GPT-4.1-nano | 93.33% | 94.33% | 93.83% | 1.89 pp | 2.38 pp |":
                  "| GPT-4.1-nano | 93.32% | 94.32% | 93.82% | 1.89 pp | 2.38 pp |",
              "| Qwen3-235B U→N | 29.6 | 50.7 | 44.8 | 24.6 |":
                  "| Qwen3-235B U→N | 29.6 | 50.6 | 44.8 | 24.6 |",
              "| Qwen3-30B D→N | 60.7 | 46.1 | 36.5 | 19.6 |":
                  "| Qwen3-30B D→N | 60.7 | 46.1 | 36.5 | 19.5 |",
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one occurrence, found {count}: {old}")
              text = text.replace(old, new)

          paper.write_text(text, encoding="utf-8")
          Path(".github/workflows/apply-paper-stat-fixes.yml").unlink()
          PY

      - name: Commit corrected PAPER.md
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PAPER.md .github/workflows/apply-paper-stat-fixes.yml
          git commit -m "Correct rounded statistics in PAPER.md"
          git push origin HEAD:fix-paper-md-stat-rounding
